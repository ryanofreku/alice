name: alice
description: Alice is an HTTP Inspector tool which helps debugging http requests. It catches and stores http requests and responses, which can be viewed via simple UI.
version: 0.3.3
#author: Jakub Homlala <jhomlala@gmail.com>
homepage: https://github.com/jhomlala/alice

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.27.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  dio: ^5.7.0
  flutter_local_notifications: 18.0.1
  rxdart: ^0.28.0

  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.2
  open_filex: ^4.6.0
  sensors_plus: ^2.0.5
  share_plus: ^10.1.3
  chopper: ^6.1.4
  collection: ^1.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  lint: ^2.3.0
